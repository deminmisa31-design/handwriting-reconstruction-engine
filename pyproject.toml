[project]
name = "handwriting-reconstruction-engine"
version = "0.1.1"
description = "Local provenance-first handwriting reconstruction workbench"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "pillow==11.3.0", "opencv-python-headless==4.12.0.88", "scikit-image==0.25.2", "flask==3.1.2"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
hre = "hre.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
